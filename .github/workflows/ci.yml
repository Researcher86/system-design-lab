name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the container
        run: make build
      - name: Install dependencies
        run: make install
      - name: Test, analyse and check formatting
        run: make check
      - name: Stop the container
        if: always()
        run: make down
